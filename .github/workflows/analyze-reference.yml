name: Analyze Reference Video

# Fetching runs here rather than locally because the analysis environment has no
# egress to YouTube. This job pulls the video on a runner, reduces it to a small
# set of derived artifacts, and commits those back — the source file itself is
# never committed.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Video URL to analyse'
        required: true
        type: string
      slug:
        description: 'Folder name under reference/ (default: derived from title)'
        required: false
        type: string
      sample_fps:
        description: 'Frames sampled per second (raise for fast-cut edits)'
        required: false
        default: '2'
        type: string
      commit:
        description: 'Commit the analysis back to this branch'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-analysis.txt

      # Runs first and independently: it needs only googleapis.com, so it still
      # succeeds when the video download is refused (YouTube blocks datacenter
      # IPs with a bot check). A failed download should not cost us the metadata.
      - name: Fetch metadata via Data API
        id: metadata
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          REFERENCE_URL: ${{ inputs.url }}
          REFERENCE_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ -z "${YOUTUBE_API_KEY:-}" ]; then
            echo "YOUTUBE_API_KEY not set — skipping metadata."
            exit 0
          fi
          python scripts/fetch_metadata.py "$REFERENCE_URL" ${REFERENCE_SLUG:+--slug "$REFERENCE_SLUG"}

      - name: Fetch reference video
        id: fetch
        continue-on-error: true
        env:
          REFERENCE_URL: ${{ inputs.url }}
          REFERENCE_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python scripts/fetch_reference.py "$REFERENCE_URL" ${REFERENCE_SLUG:+--slug "$REFERENCE_SLUG"}

      - name: Analyze
        if: steps.fetch.outcome == 'success'
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for video in reference/*/source.mp4 reference/*/source.mkv reference/*/source.webm; do
            echo "::group::$video"
            python scripts/analyze_video.py "$video" --sample-fps "${{ inputs.sample_fps }}"
            echo "::endgroup::"
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No downloaded video found under reference/."
            exit 1
          fi

      - name: Summarise
        if: always()
        run: |
          {
            for report in reference/*/METADATA.md reference/*/REPORT.md; do
              [ -f "$report" ] || continue
              cat "$report"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-analysis-${{ github.run_id }}
          path: |
            reference/**/analysis.json
            reference/**/REPORT.md
            reference/**/METADATA.md
            reference/**/contact_sheet.jpg
            reference/**/frames/**
            reference/**/metadata.json
            reference/**/transcript.txt
          retention-days: 30
          # 'warn', not 'error': a bot-check refusal leaves metadata only, and
          # that is still worth keeping.
          if-no-files-found: warn

      # Runs even when the download failed, so metadata survives a bot-check
      # refusal instead of being discarded with the rest of the run.
      - name: Commit results
        if: always() && inputs.commit
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Source media is gitignored; only derived artifacts are added.
          git add --all reference/
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: reference data for ${{ inputs.url }}"

          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push rejected on attempt ${attempt}, rebasing..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          echo "::error::Could not push results after 3 attempts."
          exit 1

      # Both fetch steps are continue-on-error so their partial output survives.
      # Report the true outcome here rather than letting the run claim success.
      - name: Report outcome
        if: always()
        run: |
          echo "metadata: ${{ steps.metadata.outcome }}"
          echo "video   : ${{ steps.fetch.outcome }}"
          if [ "${{ steps.fetch.outcome }}" != "success" ]; then
            echo "::error::Video download failed. YouTube commonly refuses GitHub runners with 'Sign in to confirm you're not a bot' — check the fetch step's log. Any metadata retrieved has still been saved."
            exit 1
          fi
